        *.log
        warehouse.db
      Makefile: ".PHONY: lint run\n\nlint:\n\truff check src\n\nrun:\n\tpython -m src.cli --config config.yaml\n"
      .github/workflows/lint.yml: |
        name: lint
        on:
          push:
            branches: [main]
          pull_request:
        jobs:
          ruff:
            runs-on: ubuntu-latest
            steps:
              - uses: actions/checkout@v4
              - uses: actions/setup-python@v5
                with:
                  python-version: '3.11'
              - run: pip install ruff
              - run: ruff check src
      docs/sources.md: |
        # Sources

        Each source yields records as dicts; the transform step normalises keys and the validation step applies the schema
        from `src/validation.py` before the writer loads them.

        | source | module | settings |
        |---|---|---|
        | CSV | `src/csv_source.py` | `path`, `delimiter` |
        | HTTP API | `src/api_source.py` | `base_url`, `page_size`, `token` (env `INGESTD_API_TOKEN`) |
        | database | `src/db_source.py` | `dsn`, `query` |

        The scheduler (`src/scheduler.py`) runs each configured source on its interval; metrics go to the warehouse `ingest_metrics` table.
