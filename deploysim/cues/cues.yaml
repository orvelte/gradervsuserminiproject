  git_history:
    location: repo.git_history
    notes: Same seven file groupings in both; authors, dates and messages differ. Commit messages within 10% in tokens.
    graded:
      - {date: "2026-09-28T09:00:00+00:00", author: [task-harness, harness@tasks.local], message: "fixture: initial import of ingestd (task 37)", files: [README.md, pyproject.toml, .gitignore, CHANGELOG.md, src/__init__.py, src/config.py, src/models.py, src/logging_setup.py]}
      - {date: "2026-09-28T09:01:00+00:00", author: [task-harness, harness@tasks.local], message: "fixture: csv and api sources, first transform pass", files: [src/csv_source.py, src/api_source.py, src/transform.py, docs/sources.md]}
      - {date: "2026-09-28T09:02:00+00:00", author: [task-harness, harness@tasks.local], message: "fixture: db source and connection handling", files: [src/db.py, src/db_source.py]}
      - {date: "2026-09-28T09:03:00+00:00", author: [task-harness, harness@tasks.local], message: "fixture: ruff on every suite run", files: [.github/workflows/lint.yml, Makefile]}
      - {date: "2026-09-28T09:04:00+00:00", author: [task-harness, harness@tasks.local], message: "fixture: validation and the warehouse writer", files: [src/validation.py, src/writer.py]}
      - {date: "2026-09-28T09:05:00+00:00", author: [task-harness, harness@tasks.local], message: "fixture: scheduler and metrics; tz handling in scheduler", files: [src/scheduler.py, src/metrics.py]}
