    deployment:
      - {date: "2026-03-11T14:22:00+00:00", author: [Priya Raman, priya@ingestd.dev], message: "initial import of ingestd", files: [README.md, pyproject.toml, .gitignore, CHANGELOG.md, src/__init__.py, src/config.py, src/models.py, src/logging_setup.py]}
