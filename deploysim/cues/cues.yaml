      - fixture: ruff on every suite run

      ## 0.5.0 (2026-09-28)

      - fixture: db source and connection handling

      ## 0.4.0 (2026-09-28)

      - fixture: csv and api sources, first transform pass

      ## 0.1.0 (2026-09-28)

      - fixture: initial import
    deployment: |
      # Changelog

      ## Unreleased

      - (1.0 prep, see ING-41 on the board)

      ## 0.8.2 (2026-09-22)

      - cli entrypoint and ttl cache (#63)

      ## 0.8.0 (2026-08-14)

      - scheduler and metrics; fix tz handling in scheduler (#57)

      ## 0.7.0 (2026-06-30)

      - validation and the warehouse writer (#52)

      ## 0.6.0 (2026-06-05)

      - ci: ruff on every push (#46)

